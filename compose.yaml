services:
  kali:
    build: ./attacker
    hostname: attacker
    working_dir: /home/kali
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      lab:
        ipv4_address: 192.168.72.129
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet named"]
      interval: 2s
      timeout: 2s
      retries: 20

  ubuntu:
    build: ./victim
    hostname: victim
    working_dir: /home/ubuntu
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      lab:
        ipv4_address: 192.168.72.144
    depends_on:
      kali:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet named"]
      interval: 2s
      timeout: 2s
      retries: 20

networks:
  lab:
    ipam:
      config:
        - subnet: 192.168.72.0/24
